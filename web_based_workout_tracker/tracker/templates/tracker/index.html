{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Home Menu</title>
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <link rel="stylesheet" href="{% static 'tracker/index.css' %}">    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <div>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{%url 'tracker:index'%}">Home</a>
                        </li>
                    </ul>
                </div>
                <div>
                    <ul class="navbar-nav">
                        {% if user.is_authenticated%}
                            <span class="navbar-text">Logged in as {{user.username}} | </span>
                            <li class="nav-item">
                                <form method="post" action="{% url 'tracker:logout' %}">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-outline-light">
                                        Logout
                                    </button>
                                </form>
                            </li>
                        {%else%}
                            <li class="nav-item">
                                <a class="nav-link" href="{%url 'tracker:signup'%}">Sign Up</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{%url 'tracker:login'%}">Log In</a>
                            </li>
                        {%endif%}
                    </ul>
                </div>
            </div>
        </nav>


        <div class="homeText">
            <h1>Hello! Welcome to this workout tracker.</h1>
            <h2>Please choose one of the following options</h2>
        </div>

        <div id="buttons">
            <a href="{%url 'tracker:new_exercise'%}"><button>Load new exercise</button></a>
            <a href="{%url 'tracker:new_workout'%}"><button>Create new workout log</button></a>
            <a href="{%url 'tracker:view_workout'%}"><button>Se workout history</button></a>
        </div>
        
        
        <div id="message">
            {{message}}
        </div>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    </body>
</html>
