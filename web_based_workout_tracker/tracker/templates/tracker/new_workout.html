{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Log Workout</title>
        <script src="{% static 'tracker/new_workout.js' %}"></script>
    </head>
    <body>
        <h1>Log a new workout!</h1>
        <a href="{%url 'tracker:index'%}"><button id="home">Homepage</button></a>

        <form method="post" id="workout_form">
            {% csrf_token %}
            <h2>Date of workout:</h2>
            <input type="date" name="date" required>
            <div id="exercise_container">

                <div class="exercise">
                    <select name="exercise" aria-placeholder="Select Exercise">
                        {% for exercise in exercises %}
                            <option value="{{ exercise.id }}">
                                {{ exercise.name }}
                            </option>
                        {% endfor %}
                    </select>

                    <input type="number" name="weight" placeholder="Weight" step="0.5">
                    <input type="number" name="reps" placeholder="Reps">
                </div>

            </div>

            <button type="button" id="add_exercise"> Add another exercise </button>
            <button type="submit">Finish Workout</button>
                    
        </form>
        
    </body>
</html>
