{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Log Workout</title>
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <script src="{% static 'tracker/new_workout.js' %}"></script>
        <link rel="stylesheet" href="{% static 'tracker/new_workout.css' %}">  
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <div>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="{%url 'tracker:index'%}">Home</a>
                        </li>
                    </ul>
                </div>
                <div>
                    <ul class="navbar-nav">
                        {% if user.is_authenticated%}
                            <span class="navbar-text">Logged in as {{user.username}} |          </span>
                            <li class="nav-item">
                                <form method="post" action="{% url 'tracker:logout' %}">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-outline-light">
                                        Logout
                                    </button>
                                </form>
                            </li>
                        {%else%}
                            <li class="nav-item">
                                <a class="nav-link" href="{%url 'tracker:signup'%}">Sign Up</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{%url 'tracker:login'%}">Log In</a>
                            </li>
                        {%endif%}
                    </ul>
                </div>
            </div>
        </nav>
        <div id="main_content">
            <h1>Log a new workout!</h1>

            <form method="post" id="workout_form">
                {% csrf_token %}
                <div class="date_wrap">
                    <div class="date_field">
                        <h2>Date of workout:</h2>
                        <input name="date" type="date" id="date" required>
                    </div>
                </div>
                
                <div id="exercise_container">

                    <div class="exercise">
                        <select name="exercise" required aria-placeholder="Select Exercise">
                            <option value="" disabled selected>Select Exercise</option>
                            {% for exercise in exercises %}
                                <option value="{{ exercise.id }}">
                                    {{ exercise.name }}
                                </option>
                            {% endfor %}
                        </select>

                        <input type="number" name="weight" placeholder="Weight" step="0.5">
                        <input type="number" name="reps" placeholder="Reps">
                    </div>

                </div>

                <div class="end_buttons">
                    <button type="button" id="add_exercise"> Add another exercise </button>
                    <button type="submit">Finish Workout</button>
                </div>     
            </form>
            
            <a href="{%url 'tracker:index'%}"><button id="home">Homepage</button></a>
        </div>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </body>
</html>
