<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Add a new exerise</title>
    </head>
    <body>
        <h1>New Exersise</h1>

        <form method="post">
            {% csrf_token %}

            <input type="text" placeholder="Exersise Name" name="exersise_name">
            <input type="number" placeholder="Personal Best" name="exersise_pb" value="0">
            <button type="submit">Add Exersise!</button>

        </form>

        <a href="{%url 'tracker:index'%}"><button id="home">Homepage</button></a>
    </body>
</html>
