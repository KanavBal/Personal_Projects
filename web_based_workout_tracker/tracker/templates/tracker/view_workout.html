{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>View Workouts</title>
        <link rel="stylesheet" href="{% static 'tracker/view_workout.css' %}">    
    </head>
    </head>
    <body>
        <h1>View Your Workouts</h1>
        {%for workout in workouts%}

            <h2>Date of workout: {{workout.date}}</h2>
            <table>
                <thead>
                    <th>Exercise</th>
                    <th>Weight</th>
                    <th>Reps</th>
                </thead>
                <tbody>
                    {%for set in workout.sets%}
                        <tr>
                            <td>{{set.exercise.name}}</td>
                            <td>{{set.weight}}</td>
                            <td>{{set.reps}}</td>
                        </tr>
                    {%endfor%}
                </tbody>
            </table>
        {%endfor%}
        
        <a href="{%url 'tracker:index'%}"><button id="home">Homepage</button></a>
    </body>
</html>
